<style>
  .container{
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex: auto;
    flex-direction: column;
}

.indicator{
    width: 200px;
    height: auto;
    margin-bottom: 20px;
}

.imlogo-text {
    font-family: 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif;
    font-size: 100px;
    font-weight: 700;
}

.progress-bar {
  width: 200px;
  background-color: #f3eefa;
  border-radius: 4px;
}

@keyframes progress {
  0% {
    width: 50%;
  }
  100% {
    width: 100%;
  }
}

.progress-bar-fill {
  display: block;
  height: 5px;
  background-color: #6750A4;
  border-radius: 4px;
  transition: width 0.2s ease-in;
  animation: progress 5s ease-in-out forwards;
}
</style>
<body style="overflow: hidden;">
<div id="loading_indicator" class="container">

  <svg class="indicator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 78" role="img" aria-label="Imlo Go">
    <text x="0" y="74" class="imlogo-text">
      <tspan fill="#AF6EFF">IMLO</tspan><tspan fill="#000000">GO</tspan>
    </text>
  </svg>
  <div class="progress-bar">
    <div class="progress-bar-fill" style="width: 50%;"></div>
  </div>
</div>



<script src="flutter_bootstrap.js" async></script>

<script>
  window.onload= function(){
    setTimeout(() => {
      var loadingIndicator = document.getElementById('loading_indicator');
      if(loadingIndicator)loadingIndicator.remove()
    }, 10000);
  }
</script>
